<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito | CI Natación</title>

    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="carrito.css">
</head>

<body>

    <header>
        <div class="logo">
            <img src="Ci.png" alt="CI Natación">
        </div>

        <h1>Mi Carrito</h1>

        <a href="index.html" class="cart">🏠</a>
    </header>

    <main class="carrito-container">

        <a href="index.html" class="volver">
            ← Seguir comprando
        </a>

        <h1 class="carrito-titulo">
            Carrito de Compras
        </h1>

        <div class="carrito-grid">

            <section class="productos-carrito">

                <div class="item">

                    <img src="Trajesdebañowebp.webp" alt="Traje de Baño">

                    <div class="detalle">
                        <h2>Traje de Baño</h2>
                        <p>Talla M</p>
                        <p class="precio">$799 MXN</p>
                    </div>

                    <button class="btn-eliminar">
                        Eliminar
                    </button>

                </div>

                <div class="item">

                    <img src="mochilas.webp" alt="Mochila">

                    <div class="detalle">
                        <h2>Mochila Deportiva</h2>
                        <p>Color Azul</p>
                        <p class="precio">$599 MXN</p>
                    </div>

                    <button class="btn-eliminar">
                        Eliminar
                    </button>

                </div>

            </section>

            <aside class="resumen">

                <h3>Resumen del Pedido</h3>

                <p>Productos: 2</p>

                <p>Envío: Gratis</p>

                <div class="total">
                    Total: $1,398 MXN
                </div>

                <button class="btn-pagar">
                    Proceder al Pago
                </button>

            </aside>

        </div>

    </main>

    <footer>
        <p>© 2026 Comercializadora Integral de Natación</p>
    </footer>

</body>

</html>
