<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulario para Crear Cuenta</title>
  <link rel="stylesheet" href="estilof.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

  <form action="/registro" method="POST" aria-label="Formulario de creación de cuenta">
    <h1>Crear Cuenta</h1>

    <label for="nombre">Nombre completo</label>
    <input type="text" id="nombre" name="nombre" required>

    <label for="email">Correo electrónico</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" required minlength="6">

    <label for="confirmar">Confirmar contraseña</label>
    <input type="password" id="confirmar" name="confirmar" required minlength="6">

    <button type="submit">Registrarse</button>

    <!-- Botón de regreso -->
    <a href="index.html" class="btn-regreso">Regresar a Inicio</a>
  </form>
<footer>

</body>
</html>
